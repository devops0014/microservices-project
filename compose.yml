name: online-boutique

services:
  frontend:
    image: chakalimurali/frontend:latest
    ports:
      - "80:8080"            # open http://localhost
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      ENABLE_PROFILER: "0"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  checkoutservice:
    image: chakalimurali/checkoutservice:latest
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:5000
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  emailservice:
    image: chakalimurali/emailservice:latest
    # In k8s the Service mapped 5000 -> 8080. Compose has no port remapping,
    # so the app listens on 5000 directly.
    environment:
      PORT: "5000"
      DISABLE_PROFILER: "1"
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  recommendationservice:
    image: chakalimurali/recommendationservice:latest
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on:
      - productcatalogservice
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 450M }
    restart: unless-stopped

  paymentservice:
    image: chakalimurali/paymentservice:latest
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  productcatalogservice:
    image: chakalimurali/productcatalogservice:latest
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  cartservice:
    image: chakalimurali/cartservice:latest
    environment:
      REDIS_ADDR: redis-cart:6379
    depends_on:
      - redis-cart
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 128M }
    restart: unless-stopped

  currencyservice:
    image: chakalimurali/currencyservice:latest
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  shippingservice:
    image: chakalimurali/shippingservice:latest
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    restart: unless-stopped

  adservice:
    image: chakalimurali/adservice:latest
    environment:
      PORT: "9555"
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 300M }
    restart: unless-stopped

  redis-cart:
    image: redis:alpine
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits: { cpus: "0.125", memory: 256M }
    restart: unless-stopped

  loadgenerator:
    image: chakalimurali/loadgenerator:latest
    environment:
      FRONTEND_ADDR: frontend:8080   # frontend listens on 8080 inside the network
      USERS: "10"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - frontend
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    restart: unless-stopped

volumes:
  redis-data:
